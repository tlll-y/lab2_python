[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "0.1.0"
description = "Streaming statistics analyzer for CSV and JSONL files"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.12.0",
    "mypy>=1.18.0"
]

[tool.setuptools.packages.find]
where = ["src"]